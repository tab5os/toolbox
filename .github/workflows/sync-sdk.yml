# Moves tab5os-sdk.txt to a newer Tab5 OS SDK, after checking the app builds
# with it. tab5os's release workflow starts it after each release; it can
# also be run by hand (Actions > sync-sdk > Run workflow), with a version or
# without one for the newest release.
#
# It only does anything in tab5os/app-template. In a repo made from the
# template it never runs: delete this file if you like.
name: sync-sdk

on:
  workflow_dispatch:
    inputs:
      version:
        description: SDK version, such as 0.1.2 (empty for the newest Tab5 OS release)
        required: false
        default: ""

concurrency:
  group: sync-sdk
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'tab5os/app-template'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1     # keep in step with build.yml
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        id: pick
        shell: bash
        env:
          WANT: ${{ inputs.version }}
        run: |
          have="$(tr -d '[:space:]' < tab5os-sdk.txt)"
          if [ -z "$WANT" ]; then
            WANT="$(curl -fsSL "https://api.github.com/repos/tab5os/tab5os/releases?per_page=100" | python3 -c '
          import json, re, sys
          vs = [r["tag_name"][1:] for r in json.load(sys.stdin)
                if not r["draft"] and re.fullmatch(r"v\d+\.\d+\.\d+", r["tag_name"])]
          print(max(vs, key=lambda v: tuple(map(int, v.split(".")))))')"
          fi
          [[ "$WANT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version: $WANT"; exit 1; }
          newer="$(python3 -c 'import sys; t = lambda v: tuple(map(int, v.split("."))); print(t(sys.argv[1]) > t(sys.argv[2]))' "$WANT" "$have")"
          echo "pinned $have, candidate $WANT"
          if [ "$newer" != True ]; then
            echo "Already on SDK $have; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=$WANT" >> "$GITHUB_OUTPUT"
          echo "newer=$newer" >> "$GITHUB_OUTPUT"

      - name: Build with it
        if: steps.pick.outputs.newer == 'True'
        shell: bash
        run: |
          echo "${{ steps.pick.outputs.version }}" > tab5os-sdk.txt
          ./build.sh
          id="$(sed -n 's/^id *= *"\([^"]*\)".*/\1/p' manifest.toml | head -1)"
          . "$IDF_PATH/export.sh" >/dev/null
          python .t5sdk/*/tools/t5/t5pack.py --inspect "build/$id.t5app"

      # A workflow can't edit workflow files with its own token, so a change of
      # ESP-IDF version (build.yml's and this file's container) is left to a person.
      - name: The SDK's ESP-IDF matches the container
        if: steps.pick.outputs.newer == 'True'
        shell: bash
        run: |
          want="$(tr -d '[:space:]' < .t5sdk/*/sdk/idf_version.txt)"
          have="$(cd "$IDF_PATH" && git describe --tags --exact-match 2>/dev/null || echo unknown)"
          [ "$want" = "$have" ] || {
            echo "::error::SDK ${{ steps.pick.outputs.version }} wants ESP-IDF $want, the template builds with $have. Change container: in build.yml and sync-sdk.yml, and tab5os-sdk.txt, by hand."
            exit 1; }

      - name: Commit
        if: steps.pick.outputs.newer == 'True'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tab5os-sdk.txt
          git commit -m "Build against Tab5 OS SDK ${{ steps.pick.outputs.version }}"
          git push origin HEAD:main
          echo "Moved to SDK ${{ steps.pick.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
